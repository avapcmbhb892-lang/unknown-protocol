<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050509">
<title>UNKNOWN PROTOCOL 4.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050509;color:#eee;font-family:Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
#canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 1px,transparent 4px)}
.app{position:relative;z-index:2;max-width:950px;margin:auto;padding:18px}
.panel{background:rgba(10,10,18,.88);border:1px solid #29293b;border-radius:22px;box-shadow:0 0 40px rgba(100,0,255,.12);backdrop-filter:blur(12px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{font-weight:900;letter-spacing:4px;font-size:20px;color:#a970ff;text-shadow:0 0 15px #7c2cff;user-select:none}
.status{font-size:11px;color:#777}
h1{font-size:clamp(30px,7vw,65px);margin:8px 0;background:linear-gradient(90deg,#fff,#9d55ff,#ff3ca6);-webkit-background-clip:text;color:transparent}
h2{margin-top:0}
p{color:#aaa;line-height:1.55}
.screen{display:none}
.screen.active{display:block}
.card{padding:25px}
.btn{border:1px solid #57339a;background:#171020;color:#fff;padding:13px 17px;border-radius:13px;transition:.15s;margin:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 20px #6b22ff55;border-color:#a970ff}
.btn.main{background:linear-gradient(135deg,#6626bd,#b21b72);border:0}
.btn.danger{border-color:#8c243e;color:#ff6688}
.btn.green{border-color:#277d61;color:#63ffbf}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:16px;border:1px solid #252538;border-radius:15px;background:#0b0b13}
.big{font-size:28px;font-weight:900}
.muted{color:#777;font-size:13px}
.progress{height:8px;background:#151520;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7a35ff,#ff3ca6);transition:.3s}
.q{font-size:23px;font-weight:800;margin:22px 0}
.answers{display:grid;gap:10px}
.answer{text-align:left;padding:15px;border-radius:14px;border:1px solid #29293b;background:#10101a;color:#fff}
.answer:hover{border-color:#965aff;background:#171124}
.answer.good{border-color:#24d997;background:#08291e}
.answer.bad{border-color:#ff416c;background:#2a0b15}
.meme{font-size:18px;border-left:3px solid #a970ff;padding:13px 16px;background:#0b0b13;border-radius:10px;margin:15px 0;color:#ddd}
.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#141421;border:1px solid #313147;font-size:12px;margin:4px}
.lock{opacity:.35}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(100px);background:#11111b;border:1px solid #6636a8;padding:14px 18px;border-radius:14px;z-index:20;transition:.3s;box-shadow:0 0 25px #000}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000b;z-index:15;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalbox{max-width:600px;width:100%;padding:28px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#08080d;color:#fff;outline:none}
#boot{position:fixed;inset:0;z-index:30;background:#020204;display:flex;align-items:center;justify-content:center;padding:20px}
.bootbox{width:min(650px,100%);font-family:monospace;color:#7cffc4}
.bootline{margin:7px 0}
.glitch{animation:glitch .15s infinite}
@keyframes glitch{0%{transform:translate(0)}33%{transform:translate(2px,-1px)}66%{transform:translate(-2px,1px)}100%{transform:translate(0)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media(max-width:600px){.app{padding:10px}.card{padding:18px}.top{align-items:flex-start}.q{font-size:19px}}

<style>
.meme-chaos{
position:fixed;z-index:50;left:50%;top:50%;
transform:translate(-50%,-50%) scale(.7);
width:min(90%,520px);padding:25px;text-align:center;
background:rgba(8,8,14,.97);border:2px solid #a970ff;
border-radius:22px;box-shadow:0 0 60px #7b2cff88;
opacity:0;pointer-events:none;transition:.25s
}
.meme-chaos.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.meme-chaos .emoji{font-size:65px}
.meme-chaos h2{font-size:27px;margin:10px 0}
.meme-chaos p{font-size:16px}
.chaos-progress{height:5px;background:#222;border-radius:9px;overflow:hidden}
.chaos-progress i{display:block;height:100%;width:100%;background:#a970ff}
.fake-ban{
position:fixed;inset:0;z-index:60;background:#050505;
display:none;align-items:center;justify-content:center;
text-align:center;padding:25px
}
.fake-ban.show{display:flex}
.fake-ban h1{font-size:clamp(35px,10vw,80px)}
</style>

<style>
.chaos-meter{height:12px;background:#15151f;border-radius:99px;overflow:hidden;margin:10px 0}
.chaos-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#55ff99,#ffff55,#ff335f);transition:.5s}
.coin{font-size:20px;font-weight:900}
.shopitem,.minigame{padding:18px;border:1px solid #29293b;background:#0c0c14;border-radius:16px;margin:10px 0}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px}
.theme-purple{filter:none}
.theme-matrix{filter:hue-rotate(70deg)}
.theme-red{filter:hue-rotate(300deg)}
.theme-cold{filter:hue-rotate(160deg)}
.crazy{animation:crazy .25s infinite}
@keyframes crazy{
0%{transform:translate(0)}
25%{transform:translate(2px,-1px)}
50%{transform:translate(-2px,2px)}
75%{transform:translate(1px,1px)}
100%{transform:translate(0)}
}
.symbols{font-size:42px;letter-spacing:10px;text-align:center;padding:20px}
.catcollection{font-size:42px;letter-spacing:5px;line-height:1.8}
</style>


<!-- ===== UNKNOWN SECRET UPDATE 6.1 ===== -->
<section id="secret61" class="screen panel card" style="display:none">
  <div class="secret61-title">🕵️ SECRET PROTOCOL 6.1</div>

  <div class="secret61">
    <b>📊 ИССЛЕДОВАНИЕ СИСТЕМЫ</b>
    <div id="secret61progress">0 / 5 секретов</div>
    <div class="secret61-progress"><i id="secret61bar" style="width:0%"></i></div>
  </div>

  <div class="secret61">
    <div class="secret61-title">📟 UNKNOWN TERMINAL</div>
    <div id="secret61terminal">
      Терминал заблокирован.<br>
      Найди правильный код.
    </div>
    <input id="secret61input" class="secret61-input"
           placeholder="Введи код..." maxlength="30">
    <button class="secret61-btn" onclick="secret61Check()">ПРОВЕРИТЬ</button>
  </div>

  <div class="secret61">
    <div class="secret61-title">🧩 ТЕКУЩАЯ ЗАГАДКА</div>
    <div id="secret61riddle">Нажми «Начать расследование».</div>
    <button class="secret61-btn" onclick="secret61Start()">🔎 НАЧАТЬ РАССЛЕДОВАНИЕ</button>
  </div>

  <button class="secret61-btn" onclick="show('menu')">← НАЗАД</button>
</section>


<script>
/* ===== UNKNOWN SECRET UPDATE 6.1 ENGINE ===== */
(function(){

  data.secret61 = data.secret61 || [];
  data.secret61Stage = data.secret61Stage || 0;
  data.secret61Solved = data.secret61Solved || false;

  function save61(){
    try{
      localStorage.setItem("unknown4", JSON.stringify(data));
    }catch(e){}
    if(typeof save === "function"){
      try{save()}catch(e){}
    }
  }

  function render61(){
    const n = data.secret61.length;
    const p = Math.min(100, n * 20);

    const text = document.getElementById("secret61progress");
    const bar = document.getElementById("secret61bar");

    if(text) text.textContent = n + " / 5 секретов";
    if(bar) bar.style.width = p + "%";
  }

  window.openSecret61 = function(){
    document.querySelectorAll(".screen").forEach(function(el){
      el.classList.remove("active");
      el.style.display="none";
    });

    const el=document.getElementById("secret61");
    if(el){
      el.classList.add("active");
      el.style.display="block";
    }

    render61();
  };

  const riddles = [
    {
      q:"Я есть у системы, но меня нельзя увидеть. Я расту после ошибок. Что это?",
      a:"хаос",
      code:"CHAOS"
    },
    {
      q:"Комната, которой нет, но в неё можно попасть. Какой номер?",
      a:"404",
      code:"ROOM404"
    },
    {
      q:"Кто говорит «мяу» и почему система его пропускает?",
      a:"кот",
      code:"CAT"
    },
    {
      q:"Что остаётся после удаления файла?",
      a:"след",
      code:"TRACE"
    },
    {
      q:"Последний вопрос: кто такой UNKNOWN?",
      a:"никто",
      code:"UNKNOWN"
    }
  ];

  window.secret61Start=function(){
    const stage=Math.min(data.secret61Stage, riddles.length-1);
    const r=riddles[stage];

    const box=document.getElementById("secret61riddle");

    if(box){
      box.innerHTML =
        "<p>"+r.q+"</p>"+
        "<input id='secret61answer' class='secret61-input' "+
        "placeholder='Твой ответ...'>"+
        "<button class='secret61-btn' onclick='secret61Answer("+stage+")'>ОТВЕТИТЬ</button>";
    }
  };

  window.secret61Answer=function(stage){
    const input=document.getElementById("secret61answer");
    if(!input) return;

    const answer=input.value.trim().toLowerCase();
    const r=riddles[stage];

    if(answer === r.a){
      if(!data.secret61.includes(r.code)){
        data.secret61.push(r.code);
      }

      data.secret61Stage=Math.min(data.secret61Stage+1, riddles.length);

      if(data.coins !== undefined) data.coins += 10;

      save61();
      render61();

      if(typeof toast==="function")
        toast("🔓 СЕКРЕТ ОТКРЫТ: "+r.code);

      if(data.secret61.length >= 5){
        data.secret61Solved=true;

        if(typeof toast==="function")
          toast("👁️ UNKNOWN ПРОТОКОЛ РАЗБЛОКИРОВАН");

        const box=document.getElementById("secret61riddle");
        if(box){
          box.innerHTML =
            "<div class='secret61-code'>UNKNOWN</div>"+
            "<p>Система больше не уверена, что ты игрок.</p>"+
            "<b>🎭 SECRET UNKNOWN ENDING UNLOCKED</b>";
        }
      }else{
        const box=document.getElementById("secret61riddle");
        if(box) box.innerHTML =
          "<div class='secret61-code'>✓ "+r.code+"</div>"+
          "<p>Следующий уровень расследования доступен.</p>"+
          "<button class='secret61-btn' onclick='secret61Start()'>ДАЛЬШЕ</button>";
      }
    }else{
      if(typeof toast==="function")
        toast("❌ Неверный ответ");

      data.chaos=Math.min(100,(data.chaos||0)+2);
      save61();
    }
  };

  window.secret61Check=function(){
    const input=document.getElementById("secret61input");
    const terminal=document.getElementById("secret61terminal");

    if(!input || !terminal) return;

    const code=input.value.trim().toUpperCase();

    const known={
      "CHAOS":"🌀 CHAOS PROTOCOL",
      "ROOM404":"🚪 ROOM 404",
      "CAT":"🐈 CAT ACCESS",
      "TRACE":"👁️ TRACE DETECTED",
      "UNKNOWN":"👤 UNKNOWN IDENTITY"
    };

    if(known[code]){
      terminal.innerHTML =
        "<div class='secret61-code'>ACCESS GRANTED</div>"+
        "<b>"+known[code]+"</b><br>"+
        "Терминал запомнил этот сигнал.";

      if(!data.secret61.includes(code)){
        data.secret61.push(code);
        if(data.coins !== undefined) data.coins += 5;
      }

      save61();
      render61();

      if(typeof toast==="function")
        toast("🔓 ACCESS GRANTED");
    }else{
      terminal.innerHTML =
        "ACCESS DENIED.<br><small>Терминал наблюдает.</small>";

      if(typeof toast==="function")
        toast("❌ ACCESS DENIED");
    }

    input.value="";
  };

  setTimeout(function(){
    const menu=document.getElementById("menu");

    if(menu && !document.getElementById("secret61btn")){
      const b=document.createElement("button");

      b.id="secret61btn";
      b.className="btn";
      b.textContent="🕵️ SECRET PROTOCOL";
      b.onclick=function(){
        openSecret61();
      };

      menu.appendChild(b);
    }

    render61();
  },1000);

})();
</script>

</body>
</html>
